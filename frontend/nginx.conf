# Batas kasar anti-banjir per IP. SENGAJA longgar: satu sekolah biasanya keluar lewat satu IP publik,
# jadi satu kelas yang login bersamaan harus tetap lolos. Perlindungan utama tebak-sandi ada di
# backend (penguncian per akun).
limit_req_zone $binary_remote_addr zone=login_zona:10m rate=120r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # DNS Docker; resolusi saat request (bukan saat start) supaya nginx tetap hidup walau api sedang mati
  resolver 127.0.0.11 valid=10s;

  location = /src/js/data-contoh.js { return 404; }

  location /api/auth/login/ {
    limit_req zone=login_zona burst=60 nodelay;
    set $api_hulu http://api:8000;
    proxy_pass $api_hulu;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/aman.conf;
  }

  location /api/ {
    set $api_hulu http://api:8000;
    proxy_pass $api_hulu;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;          # unggah dokumen materi
    proxy_read_timeout 60s;            # jawaban model AI bisa lama
    include /etc/nginx/aman.conf;
  }

  # Gambar jarang berubah
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000";
    include /etc/nginx/aman.conf;
  }

  # HTML/JS/CSS tidak punya hash di nama berkas, jadi jangan di-cache lama: selalu cek ke server (ETag).
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/aman.conf;
    try_files $uri $uri/ /index.html;
  }
}
